<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Симулятор ругани с поддержкой — прототип</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    background: #0f1115; color: #e8e8ea;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid #2a2d35;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #stage { font-size: 12px; color: #9aa0ab; }
  #resetBtn {
    background: #2a2d35; color: #e8e8ea; border: none; border-radius: 6px;
    padding: 6px 10px; font-size: 12px;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 12px; display: flex;
    flex-direction: column; gap: 8px;
  }
  .bubble {
    max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 14px;
    line-height: 1.35; white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #3a6ff7; color: white; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #1e2129; border: 1px solid #2a2d35; border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: #9aa0ab; font-size: 12px; }
  form {
    display: flex; gap: 8px; padding: 10px; border-top: 1px solid #2a2d35;
  }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #2a2d35;
    background: #1e2129; color: #e8e8ea; font-size: 14px;
  }
  button[type=submit] {
    background: #3a6ff7; color: white; border: none; border-radius: 10px;
    padding: 0 16px; font-size: 14px;
  }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>Артём · Поддержка «СвязьЛайн»</h1>
  <div id="stage">спокоен</div>
  <button id="resetBtn">Сброс</button>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" type="text" placeholder="Напиши в поддержку..." autocomplete="off">
  <button type="submit">→</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const stageEl = document.getElementById('stage');
const resetBtn = document.getElementById('resetBtn');
const sessionId = 'phone-' + Math.random().toString(36).slice(2);

function addBubble(text, cls) {
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addSys(text) {
  const div = document.createElement('div');
  div.className = 'sys';
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

addSys('Здравствуйте, вы обратились в поддержку «СвязьЛайн». Опишите проблему.');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble(text, 'user');
  input.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: text})
    });
    const data = await res.json();
    if (!res.ok) {
      addSys('Ошибка: ' + (data.error || res.status));
    } else {
      addBubble(data.reply, 'bot');
      stageEl.textContent = data.stage + ' · ход ' + data.turn;
    }
  } catch (err) {
    addSys('Сеть недоступна: ' + err);
  } finally {
    input.disabled = false;
    input.focus();
  }
});

resetBtn.addEventListener('click', async () => {
  await fetch('/api/reset', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId})
  });
  log.innerHTML = '';
  stageEl.textContent = 'спокоен';
  addSys('Диалог сброшен. Здравствуйте, вы обратились в поддержку «СвязьЛайн».');
});
</script>
</body>
</html>
