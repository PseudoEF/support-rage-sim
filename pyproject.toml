[tool.ruff]
target-version = "py312"
line-length = 100
src = ["prototype", "tests"]
extend-exclude = ["prototype/__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
