<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Скриптовый демо-симулятор разговора с техподдержкой вымышленного провайдера «СвязьЛайн». Без нейросети и сетевых запросов.">
  <title>Симулятор ругани с поддержкой — демо</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#message-input">Перейти к полю ввода</a>

  <div class="app">
    <header class="topbar">
      <div class="identity">
        <div class="avatar" aria-hidden="true">А</div>
        <div class="identity-text">
          <h1>Артём</h1>
          <p class="subtitle">Поддержка «СвязьЛайн» <span class="online-dot" aria-hidden="true"></span> онлайн</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="demo-badge">Демо без нейросети · ответы заранее написаны</span>
        <button id="reset" class="ghost-button" type="button">Начать заново</button>
      </div>
    </header>

    <div class="meta-bar">
      <span id="stage-badge" class="stage-badge" data-stage="1" aria-live="polite">
        Стадия 1 из 6 · спокойная бюрократия
      </span>
      <span id="turn-counter" class="turn-counter">Ход 0 из 12</span>
    </div>

    <main
      id="chat"
      class="chat"
      role="log"
      aria-live="polite"
      aria-relevant="additions"
      aria-label="Диалог с Артёмом из поддержки «СвязьЛайн»"
      tabindex="0"
    ></main>

    <section id="quick-replies" class="quick-replies" aria-label="Быстрые ответы"></section>

    <form id="chat-form" class="composer" novalidate>
      <label class="sr-only" for="message-input">Сообщение в поддержку</label>
      <div class="input-wrap">
        <input
          id="message-input"
          name="message"
          type="text"
          maxlength="500"
          autocomplete="off"
          spellcheck="false"
          placeholder="Напишите в поддержку…"
          aria-describedby="char-counter input-hint"
        >
        <span id="char-counter" class="char-counter">0 / 500</span>
      </div>
      <button id="send" class="send-button" type="submit">
        Отправить <span aria-hidden="true">→</span>
      </button>
      <p id="input-hint" class="sr-only">
        Максимум 500 символов. Демо завершится после 12 сообщений.
      </p>
    </form>

    <footer class="footer">
      <p>Скриптовый демо-режим. Настоящий прототип отвечает через локальную Ollama.</p>
    </footer>
  </div>

  <noscript>
    <p class="noscript">Для этого демо нужен JavaScript: весь сценарий выполняется в браузере.</p>
  </noscript>

  <script src="app.js" defer></script>
</body>
</html>
